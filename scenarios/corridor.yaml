name: "Default: 3 range/az/el sensors, 4 targets"
sim: {dt: 0.02, seed: 1}
fusion: decentralised            # or: centralised  (the GUI checkbox can still override at runtime)

comms: {enabled: true, latency_s: 0.1, drop_prob: 0.05, period_s: 0.5}

tracker:
  q_accel: 80.0
  gate_chi2: 11.34
  confirm_hits: 10
  delete_misses: 10
  delete_misses_tentative: 4
  init_vel_sigma: 100.0

# Sensor ids are assigned from list order (S0, S1, S2).
# yaw is measured about +z (0 deg = +x). Positive pitch tips the boresight DOWN.
sensors:
  - {type: range_az_el, position: [-1000, -500, 20],yaw_deg: 90.000,    fov_half_angle_deg: 30.00, max_range: 750, update_rate_hz: 5, sigma: [1, 0.573, 0.573], clutter_rate: 0.0, p_detect: 0.95}
  - {type: range_az_el, position: [-750, 500, 20],  yaw_deg: -90.000,   fov_half_angle_deg: 30.00, max_range: 750, update_rate_hz: 5, sigma: [1, 0.573, 0.573], clutter_rate: 0.0, p_detect: 0.95}
  - {type: range_az_el, position: [-500, -500, 20], yaw_deg: 90.000,    fov_half_angle_deg: 30.00, max_range: 750, update_rate_hz: 5, sigma: [1, 0.573, 0.573], clutter_rate: 0.0, p_detect: 0.95}
  - {type: range_az_el, position: [-250, 500, 20],  yaw_deg: -90.000,   fov_half_angle_deg: 30.00, max_range: 750, update_rate_hz: 5, sigma: [1, 0.573, 0.573], clutter_rate: 0.0, p_detect: 0.95}
  - {type: range_az_el, position: [0, -500, 20],    yaw_deg: 90.000,    fov_half_angle_deg: 30.00, max_range: 750, update_rate_hz: 5, sigma: [1, 0.573, 0.573], clutter_rate: 0.0, p_detect: 0.95}

# Positive turn rate = counter-clockwise seen from above.
targets:
  - {id: 1, position: [-1750,  0, 0], velocity: [25, 0, 0]}
  - {id: 2, position: [-1750,  -100, 0], velocity: [25, 0, 0]}